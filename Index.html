<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw - Tailblocks Design</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #111827; }
        .sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .winner-anim { animation: scaleUp 0.5s forwards; }
        @keyframes scaleUp { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="text-gray-400">

    <script>
        // *** วาง URL Apps Script ของคุณที่นี่ ***
        const API_URL = "https://script.google.com/macros/s/AKfycbywCGksFHNa2456ymBWEgvBaReMdRHckUi0jEpE8gdxK2GL58kzWVfPYqO4yC5dl_cnHg/exec"; 
        let drawnNumbers = [];
        let prizes = [];
        let history = [];
    </script>

    <!-- Header (Tailblocks Style) -->
    <header class="text-gray-400 bg-gray-900 body-font shadow-lg border-b border-gray-800">
        <div class="container mx-auto flex flex-wrap p-5 flex-col md:flex-row items-center">
            <a class="flex title-font font-medium items-center text-white mb-4 md:mb-0">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" class="w-10 h-10 text-white p-2 bg-indigo-500 rounded-full" viewBox="0 0 24 24">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
                </svg>
                <span class="ml-3 text-xl italic font-black text-indigo-400">LUCKY DRAW 2026</span>
            </a>
            <nav class="md:ml-auto flex flex-wrap items-center text-base justify-center">
                <button onclick="toggleSidebar('leftBar')" class="mr-5 hover:text-white cursor-pointer transition">🎁 รายการรางวัล</button>
                <button onclick="toggleSidebar('rightBar')" class="mr-5 hover:text-white cursor-pointer transition">📜 ประวัติ</button>
            </nav>
        </div>
    </header>

    <!-- Main Content (Hero Section) -->
    <section class="text-gray-400 bg-gray-900 body-font h-[calc(100vh-80px)] relative overflow-hidden">
        
        <!-- Sidebar ซ้าย: รายชื่อรางวัล -->
        <div id="leftBar" class="fixed left-0 top-0 h-full w-80 bg-gray-800 shadow-2xl z-50 p-6 sidebar -translate-x-full border-r border-gray-700">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-white text-lg font-bold">รางวัลที่มี</h2>
                <button onclick="toggleSidebar('leftBar')" class="text-gray-400 hover:text-white">✕</button>
            </div>
            <div id="prizeList" class="space-y-3"></div>
        </div>

        <!-- Sidebar ขวา: ประวัติ -->
        <div id="rightBar" class="fixed right-0 top-0 h-full w-80 bg-gray-800 shadow-2xl z-50 p-6 sidebar translate-x-full border-l border-gray-700">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-white text-lg font-bold">ประวัติการสุ่ม</h2>
                <button onclick="toggleSidebar('rightBar')" class="text-gray-400 hover:text-white">✕</button>
            </div>
            <div id="historyList" class="space-y-4 overflow-y-auto h-[80vh]"></div>
        </div>

        <div class="container mx-auto flex px-5 py-24 items-center justify-center flex-col h-full">
            <div id="displayPrize" class="mb-4 text-indigo-400 text-2xl font-medium tracking-widest uppercase"></div>
            
            <!-- พื้นที่แสดงตัวเลข (เน้นใหญ่พิเศษตามโจทย์) -->
            <div id="numberContainer" class="flex flex-wrap justify-center gap-8 mb-12">
                <h1 class="title-font sm:text-9xl text-7xl mb-4 font-black text-white italic opacity-10">READY</h1>
            </div>

            <div class="flex justify-center">
                <button id="drawBtn" onclick="startDraw()" class="inline-flex text-white bg-indigo-500 border-0 py-4 px-12 focus:outline-none hover:bg-indigo-600 rounded-full text-2xl font-bold shadow-indigo-500/50 shadow-2xl transition-all transform hover:scale-105 active:scale-95 disabled:opacity-30">
                    เริ่มสุ่มรางวัลถัดไป
                </button>
            </div>
            <p class="mt-8 text-sm text-gray-500 italic">เหลือรางวัลทั้งหมดในระบบอีก <span id="prizeCount" class="text-indigo-400">-</span> รายการ</p>
        </div>
    </section>

    <script>
        function toggleSidebar(id) {
            const el = document.getElementById(id);
            if (id === 'leftBar') el.classList.toggle('-translate-x-full');
            else el.classList.toggle('translate-x-full');
        }

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                prizes = data.prizes.sort((a,b) => a.priority - b.priority);
                drawnNumbers = data.drawnNumbers.map(n => parseInt(n));
                history = data.history;
                renderUI();
            } catch (e) { console.error("Fetch Error:", e); }
        }

        function renderUI() {
            document.getElementById('prizeList').innerHTML = prizes.map(p => `
                <div class="flex items-center p-3 bg-gray-900 rounded-lg border border-gray-700">
                    <div class="w-10 h-10 inline-flex items-center justify-center rounded-full bg-gray-800 text-indigo-400 mr-3">
                        ${p.emoji}
                    </div>
                    <span class="text-gray-300 font-medium">${p.name}</span>
                </div>
            `).join('');

            document.getElementById('historyList').innerHTML = history.map(h => `
                <div class="p-3 bg-gray-900 rounded-lg border-l-4 border-indigo-500">
                    <p class="text-white font-bold text-lg leading-none"># ${h.number}</p>
                    <p class="text-gray-500 text-xs mt-1 uppercase tracking-tighter">${h.prize}</p>
                </div>
            `).join('');

            document.getElementById('prizeCount').innerText = prizes.length;
        }

        async function startDraw() {
            const targetPrize = prizes.find(p => p.remain > 0);
            if (!targetPrize) return alert("จบกิจกรรม! ของรางวัลหมดแล้ว");

            const btn = document.getElementById('drawBtn');
            btn.disabled = true;
            document.getElementById('displayPrize').innerText = `🏆 กำลังสุ่ม: ${targetPrize.name}`;
            
            let available = [];
            for(let i=1; i<=182; i++) {
                if(!drawnNumbers.includes(i)) available.push(i);
            }

            let winners = [];
            let countToDraw = Math.min(targetPrize.remain, available.length);
            for(let i=0; i<countToDraw; i++) {
                const randomIndex = Math.floor(Math.random() * available.length);
                winners.push(available.splice(randomIndex, 1)[0]);
            }

            const container = document.getElementById('numberContainer');
            container.innerHTML = winners.map(() => `
                <div class="w-32 h-32 flex items-center justify-center rounded-3xl bg-gray-800 border-2 border-indigo-500 text-5xl font-black text-indigo-400 animate-pulse">?</div>
            `).join('');

            setTimeout(async () => {
                container.innerHTML = winners.map(n => `
                    <div class="w-40 h-40 flex flex-col items-center justify-center rounded-3xl bg-white text-gray-900 text-7xl font-black shadow-2xl winner-anim">
                        ${n}
                    </div>
                `).join('');

                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "saveResult", prizeName: targetPrize.name, winners: winners })
                });

                drawnNumbers.push(...winners);
                fetchData();
                btn.disabled = false;
            }, 2000);
        }

        fetchData();
    </script>
</body>
</html>
