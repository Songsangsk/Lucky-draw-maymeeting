<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;600;900&display=swap');
        body { font-family: 'Kanit', sans-serif; background-color: #0f172a; color: white; overflow: hidden; }
        .sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hide-left { transform: translateX(-100%); }
        .hide-right { transform: translateX(100%); }
        .winner-card { animation: bounceIn 0.6s ease; }
        @keyframes bounceIn {
            0% { transform: scale(0.3); opacity: 0; }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <script>
        const API_URL = "ใส่_URL_APPS_SCRIPT_ที่นี่"; 
        let drawnNumbers = [];
        let prizes = [];
        let history = [];
    </script>

    <div id="leftBar" class="fixed left-0 top-0 h-full w-72 bg-slate-800 shadow-2xl z-20 p-6 sidebar">
        <h2 class="text-2xl font-black mb-6 border-b border-slate-600 pb-2 text-yellow-500">รางวัลทั้งหมด</h2>
        <div id="prizeList" class="space-y-3 overflow-y-auto h-[80vh]"></div>
        <button onclick="toggleSidebar('leftBar')" class="absolute -right-10 top-1/2 bg-yellow-500 p-2 rounded-r-lg text-slate-900 font-bold">◀</button>
    </div>

    <div id="rightBar" class="fixed right-0 top-0 h-full w-72 bg-slate-800 shadow-2xl z-20 p-6 sidebar hide-right">
        <h2 class="text-2xl font-black mb-6 border-b border-slate-600 pb-2 text-cyan-400">ประวัติการสุ่ม</h2>
        <div id="historyList" class="space-y-2 overflow-y-auto h-[80vh] text-sm"></div>
        <button onclick="toggleSidebar('rightBar')" class="absolute -left-10 top-1/2 bg-cyan-400 p-2 rounded-l-lg text-slate-900 font-bold">▶</button>
    </div>

    <div class="flex flex-col items-center justify-center h-screen w-full px-10">
        <div id="statusLabel" class="text-2xl mb-4 text-slate-400">พร้อมเริ่มการสุ่ม</div>
        <div id="displayPrize" class="text-4xl font-bold text-yellow-400 mb-10 text-center"></div>
        
        <div id="numberContainer" class="flex flex-wrap justify-center gap-6 max-w-5xl">
            <div class="text-9xl font-black text-slate-700 opacity-20 italic">READY</div>
        </div>

        <button id="drawBtn" onclick="startDraw()" class="mt-16 bg-gradient-to-r from-red-600 to-pink-600 hover:from-red-500 hover:to-pink-500 px-16 py-6 rounded-full text-3xl font-black shadow-[0_0_50px_rgba(220,38,38,0.5)] transition-all transform hover:scale-110 active:scale-95 disabled:opacity-50">
            สุ่มรางวัล!
        </button>
    </div>

    <script>
        function toggleSidebar(id) {
            const el = document.getElementById(id);
            if (id === 'leftBar') el.classList.toggle('hide-left');
            else el.classList.toggle('hide-right');
        }

        async function fetchData() {
            const res = await fetch(API_URL);
            const data = await res.json();
            prizes = data.prizes.sort((a,b) => a.priority - b.priority);
            drawnNumbers = data.drawnNumbers.map(n => parseInt(n));
            history = data.history;
            renderUI();
        }

        function renderUI() {
            // Render รางวัล (ไม่โชว์จำนวนตามโจทย์)
            document.getElementById('prizeList').innerHTML = prizes.map(p => `
                <div class="p-3 bg-slate-700 rounded-lg flex items-center gap-3">
                    <span class="text-2xl">${p.emoji}</span>
                    <span class="font-bold">${p.name}</span>
                </div>
            `).join('');

            // Render ประวัติ
            document.getElementById('historyList').innerHTML = history.map(h => `
                <div class="p-2 bg-slate-700 rounded border-l-4 border-cyan-400">
                    เลข <span class="font-bold text-white text-lg">${h.number}</span> - ${h.prize}
                </div>
            `).join('');
        }

        async function startDraw() {
            const targetPrize = prizes.find(p => p.remain > 0);
            if (!targetPrize) return alert("ของรางวัลหมดแล้ว!");

            const btn = document.getElementById('drawBtn');
            btn.disabled = true;
            document.getElementById('displayPrize').innerText = `กำลังสุ่ม: ${targetPrize.emoji} ${targetPrize.name}`;
            
            // เลือกเลขที่ยังไม่ถูกสุ่ม
            let available = [];
            for(let i=1; i<=182; i++) {
                if(!drawnNumbers.includes(i)) available.push(i);
            }

            // สุ่มเลขตามจำนวนรางวัล
            let winners = [];
            let countToDraw = Math.min(targetPrize.remain, available.length);
            
            for(let i=0; i<countToDraw; i++) {
                const randomIndex = Math.floor(Math.random() * available.length);
                winners.push(available.splice(randomIndex, 1)[0]);
            }

            // Effect การสุ่ม
            const container = document.getElementById('numberContainer');
            container.innerHTML = winners.map(() => `<div class="text-8xl font-black text-white winner-card">??</div>`).join('');

            // หน่วงเวลาให้ดูตื่นเต้น
            setTimeout(async () => {
                container.innerHTML = winners.map(n => `
                    <div class="bg-white text-slate-900 w-40 h-40 flex items-center justify-center rounded-2xl text-7xl font-black shadow-white/20 shadow-2xl winner-card">
                        ${n}
                    </div>
                `).join('');

                // ส่งไปบันทึก Backend
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: "saveResult", prizeName: targetPrize.name, winners: winners })
                });

                drawnNumbers.push(...winners);
                fetchData(); // รีเฟรชข้อมูล
                btn.disabled = false;
            }, 1500);
        }

        fetchData();
    </script>
</body>
</html>
