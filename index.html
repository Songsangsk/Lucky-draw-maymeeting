<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw System 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .prize-item.active { border-color: #4f46e5; background-color: #eff6ff; border-width: 2px; }
        .winner-card { animation: pop 0.5s ease-out forwards; }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="overflow-hidden h-screen">

    <!-- แถบข้างซ้าย: ของรางวัล -->
    <div id="leftBar" class="sidebar fixed left-0 top-0 h-full w-72 bg-white border-r shadow-2xl z-50 -translate-x-full overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-slate-800">เลือกของรางวัล</h2>
            <button onclick="toggleBar('leftBar')" class="text-slate-400 hover:text-red-500">✕</button>
        </div>
        <div id="prizeList" class="space-y-2"></div>
    </div>

    <!-- แถบข้างขวา: ประวัติ -->
    <div id="rightBar" class="sidebar fixed right-0 top-0 h-full w-72 bg-white border-l shadow-2xl z-50 translate-x-full overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-slate-800">ประวัติสุ่ม (เรียงเลข)</h2>
            <button onclick="toggleBar('rightBar')" class="text-slate-400 hover:text-red-500">✕</button>
        </div>
        <div id="historyList" class="space-y-1"></div>
    </div>

    <!-- Main Content -->
    <div class="flex flex-col items-center justify-center h-full p-4 relative">
        
        <!-- Toggle Buttons -->
        <div class="fixed top-6 w-full px-8 flex justify-between z-40">
            <button onclick="toggleBar('leftBar')" class="bg-white border shadow-md px-5 py-2 rounded-full hover:bg-slate-50 transition font-bold text-indigo-600">🎁 ของรางวัล</button>
            <button onclick="toggleBar('rightBar')" class="bg-white border shadow-md px-5 py-2 rounded-full hover:bg-slate-50 transition font-bold text-indigo-600">📜 ประวัติ</button>
        </div>

        <!-- Drawing Zone -->
        <div class="text-center w-full max-w-4xl">
            <h1 id="selectedPrizeName" class="text-4xl md:text-6xl font-extrabold text-slate-800 mb-2">กรุณาเลือกรางวัล</h1>
            <p id="limitInfo" class="text-slate-400 mb-8 font-medium">รอการเชื่อมต่อฐานข้อมูล...</p>

            <!-- Input จำนวนที่จะสุ่ม -->
            <div class="flex items-center justify-center gap-4 mb-10">
                <span class="text-slate-500 font-bold">จำนวนที่สุ่มรอบนี้:</span>
                <input type="number" id="drawQty" value="1" min="1" class="w-20 text-center text-2xl font-bold border-2 border-indigo-100 rounded-lg p-2 outline-none focus:border-indigo-500">
            </div>

            <!-- Area แสดงตัวเลข -->
            <div id="numberContainer" class="flex flex-wrap justify-center gap-6 mb-12 min-h-[200px]">
                <div class="text-slate-200 text-9xl font-black italic select-none opacity-20">READY</div>
            </div>

            <!-- Action Button -->
            <button id="drawBtn" onclick="startDraw()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-3xl font-black px-16 py-6 rounded-2xl shadow-xl transform active:scale-95 transition-all disabled:opacity-30">
                เริ่มสุ่มรางวัล
            </button>
            
            <p class="mt-8 text-slate-400 text-xs uppercase tracking-widest">182 Participants • System v2.0</p>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyxKwOd9h1mvZlWxQAKTdfZYuVOd_h_intdIRx52z8CvRF6OHIEs2qYCX6R0BpowBtF4g/exec"; 
        const AUTH_TOKEN = "I_want_to_eat_rn";
        let prizes = [], drawnNumbers = [], history = [], selectedPrize = null;

        async function init() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                prizes = data.prizes;
                drawnNumbers = data.drawnNumbers;
                history = data.history;
                
                renderPrizes();
                renderHistory();
                
                if (prizes.length > 0 && !selectedPrize) {
                    selectPrize(0);
                }
            } catch (e) { alert("เชื่อมต่อ API ไม่สำเร็จ"); }
        }

        function renderPrizes() {
            const list = document.getElementById('prizeList');
            list.innerHTML = prizes.map((p, i) => `
                <div id="p-item-${i}" onclick="selectPrize(${i})" class="prize-item p-4 border rounded-xl cursor-pointer transition-all hover:shadow-md">
                    <p class="font-bold text-slate-700">${p.name}</p>
                </div>
            `).join('');
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            // เรียงประวัติจากเลขน้อยไปมาก
            const sortedHistory = [...history].sort((a, b) => Number(a.number) - Number(b.number));
            list.innerHTML = sortedHistory.map(h => `
                <div class="flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-100">
                    <span class="font-black text-indigo-600">#${h.number}</span>
                    <span class="text-xs text-slate-500 truncate ml-2">${h.prize}</span>
                </div>
            `).join('');
        }

        function selectPrize(index) {
            selectedPrize = prizes[index];
            document.querySelectorAll('.prize-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`p-item-${index}`).classList.add('active');
            document.getElementById('selectedPrizeName').innerText = selectedPrize.name;
            document.getElementById('drawQty').max = selectedPrize.remain;
            document.getElementById('limitInfo').innerText = `มีสิทธิ์สุ่มได้สูงสุด ${selectedPrize.remain} ครั้งสำหรับรางวัลนี้`;
        }

        async function startDraw() {
            const qtyInput = document.getElementById('drawQty');
            const qty = parseInt(qtyInput.value);

            if (!selectedPrize) return alert("เลือกของรางวัลก่อนครับ");
            if (qty > selectedPrize.remain) return alert(`รางวัลนี้เหลือเพียง ${selectedPrize.remain} ชิ้นเท่านั้น`);
            
            const btn = document.getElementById('drawBtn');
            btn.disabled = true;

            // Logic หาเลขที่เหลือ (1-182)
            let available = [];
            for(let i=1; i<=182; i++) if(!drawnNumbers.includes(i)) available.push(i);

            if(available.length < qty) return alert("จำนวนคนที่มีสิทธิ์เหลือน้อยกว่าจำนวนที่ต้องการสุ่ม");

            let winners = [];
            for(let i=0; i<qty; i++) {
                const randIdx = Math.floor(Math.random() * available.length);
                winners.push(available.splice(randIdx, 1)[0]);
            }

            // แสดงผล UI
            const container = document.getElementById('numberContainer');
            container.innerHTML = winners.map(n => `
                <div class="winner-card w-28 h-28 md:w-44 md:h-44 bg-white border-4 border-indigo-50 rounded-3xl shadow-2xl flex items-center justify-center text-4xl md:text-6xl font-black text-indigo-600 italic">
                    ${n}
                </div>
            `).join('');

            // บันทึกไป Backend
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "saveResult", prizeName: selectedPrize.name, winners, auth_token: AUTH_TOKEN })
            });

            // อัปเดตข้อมูลใหม่
            await init();
            btn.disabled = false;
        }

        function toggleBar(id) {
            const el = document.getElementById(id);
            if (id === 'leftBar') el.classList.toggle('-translate-x-full');
            else el.classList.toggle('translate-x-full');
        }

        window.onload = init;
    </script>
</body>
</html>
