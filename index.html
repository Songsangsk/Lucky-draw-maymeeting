<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw System 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .winner-card { animation: pop 0.5s ease-out forwards; }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* แก้ไขส่วน countdown-circle ทั้งหมดใน <style> */
.countdown-circle {
    width: 150px; 
    height: 150px;
    border-radius: 50%;
    border: 8px solid #e2e8f0; /* เส้นพื้นหลังสีเทา */
    position: relative;
    display: flex; 
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
}

/* เส้นสีม่วงที่หมุน */
.countdown-circle::before {
    content: '';
    position: absolute;
    top: -8px; 
    left: -8px; 
    width: 150px; 
    height: 150px;
    border-radius: 50%;
    border: 8px solid transparent;
    border-top-color: #4f46e5; /* สีม่วง indigo-600 */
    animation: spin 1s linear infinite;
    box-sizing: border-box;
    pointer-events: none;
}

#timerText {
    font-size: 4rem; /* ขนาดเลข */
    font-weight: 900;
    color: #4f46e5;
    z-index: 10;
    /* บังคับให้อยู่กึ่งกลางเป๊ะ */
    display: block;
    line-height: 1;
}

@keyframes spin { 
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); } 
}

.prize-item.active { border-color: #4f46e5; background-color: #eff6ff; border-width: 2px; }
    </style>
</head>
<body class="overflow-hidden h-screen text-slate-800">

    <!-- แถบข้างซ้าย: ของรางวัล -->
    <div id="leftBar" class="sidebar fixed left-0 top-0 h-full w-72 bg-white border-r shadow-2xl z-50 -translate-x-full overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">เลือกของรางวัล</h2>
            <button onclick="toggleBar('leftBar')" class="text-slate-400 hover:text-red-500 text-2xl">✕</button>
        </div>
        <div id="prizeList" class="space-y-2"></div>
    </div>

    <!-- แถบข้างขวา: ประวัติ -->
    <div id="rightBar" class="sidebar fixed right-0 top-0 h-full w-72 bg-white border-l shadow-2xl z-50 translate-x-full overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">ประวัติสุ่ม (เรียงเลข)</h2>
            <button onclick="toggleBar('rightBar')" class="text-slate-400 hover:text-red-500 text-2xl">✕</button>
        </div>
        <div id="historyList" class="space-y-1"></div>
    </div>

    <!-- Main Content -->
    <div class="flex flex-col items-center justify-center h-full p-4 relative">

        <!-- Toggle Buttons -->
        <div class="fixed top-6 w-full px-8 flex justify-between z-40">
            <button onclick="toggleBar('leftBar')" class="bg-white border shadow-md px-6 py-2.5 rounded-full hover:bg-slate-50 transition font-bold text-indigo-600 flex items-center gap-2">
                <span>🎁</span> เลือกของรางวัล
            </button>
            <button onclick="toggleBar('rightBar')" class="bg-white border shadow-md px-6 py-2.5 rounded-full hover:bg-slate-50 transition font-bold text-indigo-600 flex items-center gap-2">
                <span>📜</span> ดูประวัติสุ่ม
            </button>
        </div>

        <div class="text-center w-full max-w-5xl px-4">
            <h1 id="selectedPrizeName" class="text-4xl md:text-6xl font-extrabold text-slate-800 mb-2 italic">เลือกรางวัลเพื่อเริ่ม</h1>

            <!-- ส่วน Input กำหนดจำนวนสุ่ม -->
            <div class="flex flex-col items-center gap-2 mt-8 mb-10">
                <p class="text-slate-500 font-bold uppercase tracking-wider text-sm">ระบุจำนวนผู้โชคดีรอบนี้</p>
                <div class="flex items-center gap-3">
                    <input type="number" id="drawQty" value="1" min="1" 
                        class="w-24 text-center text-4xl font-black border-b-4 border-indigo-200 bg-transparent py-2 outline-none focus:border-indigo-500 transition-all">
                    <span class="text-slate-400 font-bold text-xl">คน</span>
                </div>
            </div>

            <!-- Area แสดงผล (วงกลมรอสุ่ม / ตัวเลขผู้ชนะ) -->
            <div id="displayArea" class="flex flex-wrap justify-center items-center gap-4 md:gap-8 mb-12 min-h-[250px]">
                <div class="text-slate-100 text-8xl font-black italic select-none opacity-40">READY</div>
            </div>

            <button id="drawBtn" onclick="handleDrawClick()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-3xl font-black px-20 py-6 rounded-3xl shadow-[0_20px_50px_rgba(79,70,229,0.3)] transform active:scale-95 transition-all disabled:opacity-30">
                กดเพื่อเริ่มสุ่ม
            </button>

            <p id="remainingUsers" class="mt-8 text-indigo-500 font-bold text-sm uppercase tracking-widest">
                กำลังโหลดข้อมูลคน...
            </p>
        </div>
    </div>

    <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzSYktzpNkUJnmjyK8O2MaiJDt56FJWp0tKYQmaatLz_FnHK04IpdnuufimZME_cA2Fvg/exec"; 
    const AUTH_TOKEN = "I_want_to_eat_rn";
    let prizes = [], drawnNumbers = [], history = [], selectedPrize = null;

    async function init() {
        try {
            const res = await fetch(API_URL);
            const data = await res.json();
            prizes = data.prizes;
            drawnNumbers = data.drawnNumbers;
            history = data.history;

            renderPrizes();
            renderHistory();
            updateUserCount();
        } catch (e) { console.error("Sync Error:", e); }
    }

    function updateUserCount() {
        const remaining = 182 - drawnNumbers.length;
        document.getElementById('remainingUsers').innerText = `จำนวนคนที่ยังไม่สุ่ม ${remaining} คน`;
    }

    function renderPrizes() {
        const list = document.getElementById('prizeList');
        list.innerHTML = prizes.map((p, i) => `
            <div id="p-item-${i}" onclick="selectPrize(${i})" class="prize-item p-4 border rounded-xl cursor-pointer transition-all hover:bg-indigo-50 group ${selectedPrize && selectedPrize.name === p.name ? 'active' : ''}">
                <p class="font-bold text-slate-700 group-hover:text-indigo-600">${p.name}</p>
            </div>
        `).join('');
    }

    function renderHistory() {
        const list = document.getElementById('historyList');
        const sorted = [...history].sort((a, b) => Number(a.number) - Number(b.number));
        list.innerHTML = sorted.map(h => `
            <div class="flex justify-between items-center bg-slate-50 p-2 rounded border mb-1">
                <span class="font-black text-indigo-600 text-lg">#${h.number}</span>
                <span class="text-xs text-slate-500 truncate ml-2">${h.prize}</span>
            </div>
        `).join('');
    }

    function selectPrize(index) {
        selectedPrize = prizes[index];
        renderPrizes();
        document.getElementById('selectedPrizeName').innerText = selectedPrize.name;
        toggleBar('leftBar');
    }

    // ฟังก์ชันเปิด-ปิดแถบข้าง (แก้ไขให้ทำงานได้ปกติ)
    function toggleBar(id) {
        const el = document.getElementById(id);
        if (id === 'leftBar') {
            el.classList.toggle('-translate-x-full');
        } else {
            el.classList.toggle('translate-x-full');
        }
    }

    // ฟังก์ชันเมื่อกดปุ่มสุ่ม (ตัด Countdown ออกแล้ว)
    async function handleDrawClick() {
        if (!selectedPrize) return alert("กรุณาเลือกของรางวัลก่อนครับ");

        const qty = parseInt(document.getElementById('drawQty').value);
        if (qty < 1) return alert("ระบุจำนวนอย่างน้อย 1 คน");
        if (qty > selectedPrize.remain) {
            return alert(`ไม่สามารถสุ่ม ${qty} คนได้ เนื่องจากตอนนี้ของเหลือเพียง ${selectedPrize.remain} ชิ้น`);
        }

        const available = [];
        for(let i=1; i<=182; i++) if(!drawnNumbers.includes(i)) available.push(i);
        if(available.length < qty) return alert("จำนวนคนที่มีสิทธิ์ไม่พอ");

        const btn = document.getElementById('drawBtn');
        btn.disabled = true; // ปิดปุ่มกันกดซ้ำ
        
        executeDraw(qty, available); // เริ่มแสดงผลทันที
    }

    async function executeDraw(qty, available) {
        let winners = [];
        for (let i = 0; i < qty; i++) {
            const randIdx = Math.floor(Math.random() * available.length);
            winners.push(available.splice(randIdx, 1)[0]);
        }

        const displayArea = document.getElementById('displayArea');
        displayArea.innerHTML = ""; 

        // Logic การแสดงผลแบบทยอยขึ้น
        if (qty <= 10) {
            for (let i = 0; i < winners.length; i++) {
                const cardHtml = `
                    <div class="winner-card w-24 h-24 md:w-40 md:h-40 bg-white border-4 border-indigo-100 rounded-3xl shadow-xl flex items-center justify-center text-4xl md:text-6xl font-black text-indigo-600 italic">
                        ${winners[i]}
                    </div>`;
                displayArea.insertAdjacentHTML('beforeend', cardHtml);
                if (i < winners.length - 1) await new Promise(r => setTimeout(r, 1000)); // รอ 1 วินาทีต่อเลข
            }
        } else {
            for (let i = 0; i < winners.length; i += 5) {
                const chunk = winners.slice(i, i + 5);
                const chunkHtml = chunk.map(n => `
                    <div class="winner-card w-24 h-24 md:w-40 md:h-40 bg-white border-4 border-indigo-100 rounded-3xl shadow-xl flex items-center justify-center text-4xl md:text-6xl font-black text-indigo-600 italic">
                        ${n}
                    </div>`).join('');
                displayArea.insertAdjacentHTML('beforeend', chunkHtml);
                if (i + 5 < winners.length) await new Promise(r => setTimeout(r, 1000)); // รอ 1 วินาทีต่อชุด
            }
        }

        document.getElementById('drawBtn').disabled = false;
        saveAndSync(winners);
    }

    async function saveAndSync(winners) {
        try {
            drawnNumbers.push(...winners);
            updateUserCount();
            selectedPrize.remain -= winners.length;

            await fetch(API_URL, {
                method: 'POST',
                mode: 'no-cors',
                body: JSON.stringify({ 
                    action: "saveResult", 
                    prizeName: selectedPrize.name, 
                    winners, 
                    auth_token: AUTH_TOKEN 
                })
            });

            const res = await fetch(API_URL);
            const data = await res.json();
            prizes = data.prizes;
            drawnNumbers = data.drawnNumbers;
            history = data.history;
            renderHistory();
        } catch (e) { console.error("Save Error"); }
    }

    window.onload = init;
</script>
</body>
</html>
