<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw System 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f8fafc; }
        .sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .prize-item.active { border-color: #4f46e5; background-color: #eff6ff; border-width: 2px; }
        .winner-card { animation: pop 0.5s ease-out forwards; }
        @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="overflow-hidden h-screen">

    <!-- แถบข้างซ้าย: ของรางวัล -->
    <div id="leftBar" class="sidebar fixed left-0 top-0 h-full w-72 bg-white border-r shadow-2xl z-50 -translate-x-full overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-slate-800">เลือกของรางวัล</h2>
            <button onclick="toggleBar('leftBar')" class="text-slate-400 hover:text-red-500 text-2xl">✕</button>
        </div>
        <div id="prizeList" class="space-y-2"></div>
    </div>

    <!-- แถบข้างขวา: ประวัติ -->
    <div id="rightBar" class="sidebar fixed right-0 top-0 h-full w-72 bg-white border-l shadow-2xl z-50 translate-x-full overflow-y-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-slate-800">ประวัติสุ่ม (เรียงเลข)</h2>
            <button onclick="toggleBar('rightBar')" class="text-slate-400 hover:text-red-500 text-2xl">✕</button>
        </div>
        <div id="historyList" class="space-y-1"></div>
    </div>

    <!-- Main Content -->
    <div class="flex flex-col items-center justify-center h-full p-4 relative">
        
        <!-- Toggle Buttons -->
        <div class="fixed top-6 w-full px-8 flex justify-between z-40">
            <button onclick="toggleBar('leftBar')" class="bg-white border shadow-md px-6 py-2.5 rounded-full hover:bg-slate-50 transition font-bold text-indigo-600 flex items-center gap-2">
                <span>🎁</span> เลือกของรางวัล
            </button>
            <button onclick="toggleBar('rightBar')" class="bg-white border shadow-md px-6 py-2.5 rounded-full hover:bg-slate-50 transition font-bold text-indigo-600 flex items-center gap-2">
                <span>📜</span> ดูประวัติสุ่ม
            </button>
        </div>

        <!-- Drawing Zone -->
        <div class="text-center w-full max-w-5xl px-4">
            <h1 id="selectedPrizeName" class="text-4xl md:text-6xl font-extrabold text-slate-800 mb-2">กรุณาเลือกรางวัล</h1>
            <p id="limitInfo" class="text-slate-400 mb-8 font-medium italic">รอการเลือกรางวัลจากแถบด้านซ้าย...</p>

            <!-- ช่องกำหนดจำนวนเลขที่จะสุ่ม (เพิ่มใหม่) -->
            <div class="flex flex-col items-center gap-3 mb-10">
                <label for="drawQty" class="text-slate-600 font-bold text-lg">ต้องการสุ่มจำนวนกี่คนในรอบนี้?</label>
                <div class="flex items-center gap-4">
                    <input type="number" id="drawQty" value="1" min="1" 
                        class="w-24 text-center text-3xl font-black border-4 border-indigo-100 rounded-2xl p-3 outline-none focus:border-indigo-500 transition-all shadow-inner">
                    <span class="text-slate-400 font-bold text-xl">คน</span>
                </div>
            </div>

            <!-- Area แสดงตัวเลขที่สุ่มได้ -->
            <div id="numberContainer" class="flex flex-wrap justify-center gap-4 md:gap-8 mb-12 min-h-[220px] max-h-[45vh] overflow-y-auto p-4">
                <div class="text-slate-200 text-7xl md:text-9xl font-black italic select-none opacity-20 mt-10">READY</div>
            </div>

            <!-- Action Button -->
            <button id="drawBtn" onclick="startDraw()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-3xl font-black px-20 py-6 rounded-3xl shadow-[0_20px_50px_rgba(79,70,229,0.3)] transform active:scale-95 transition-all disabled:opacity-30 disabled:cursor-not-allowed">
                กดเพื่อเริ่มสุ่ม
            </button>
            
            <p class="mt-8 text-slate-400 text-xs uppercase tracking-widest font-bold">Total 182 Participants</p>
        </div>
    </div>

    <script>
        // *** ใส่ URL ที่ได้จากตอน Deploy Google Apps Script ***
        const API_URL = "ใส่_WEB_APP_URL_ที่นี่"; 
        const AUTH_TOKEN = "I_want_to_eat_rn";
        let prizes = [], drawnNumbers = [], history = [], selectedPrize = null;

        async function init() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                prizes = data.prizes;
                drawnNumbers = data.drawnNumbers;
                history = data.history;
                
                renderPrizes();
                renderHistory();
            } catch (e) { console.error("API Error:", e); }
        }

        function renderPrizes() {
            const list = document.getElementById('prizeList');
            list.innerHTML = prizes.map((p, i) => `
                <div id="p-item-${i}" onclick="selectPrize(${i})" class="prize-item p-4 border rounded-xl cursor-pointer transition-all hover:bg-indigo-50 group">
                    <p class="font-bold text-slate-700 group-hover:text-indigo-600">${p.name}</p>
                </div>
            `).join('');
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            const sortedHistory = [...history].sort((a, b) => Number(a.number) - Number(b.number));
            list.innerHTML = sortedHistory.map(h => `
                <div class="flex justify-between items-center bg-slate-50 p-2 rounded border border-slate-100 mb-1">
                    <span class="font-black text-indigo-600 text-lg">#${h.number}</span>
                    <span class="text-xs text-slate-500 truncate ml-2 max-w-[120px]">${h.prize}</span>
                </div>
            `).join('');
        }

        function selectPrize(index) {
            selectedPrize = prizes[index];
            document.querySelectorAll('.prize-item').forEach(el => el.classList.remove('active'));
            document.getElementById(`p-item-${index}`).classList.add('active');
            
            document.getElementById('selectedPrizeName').innerText = selectedPrize.name;
            document.getElementById('drawQty').max = selectedPrize.remain;
            document.getElementById('limitInfo').innerText = `เหลือรางวัลนี้ในระบบอีก ${selectedPrize.remain} ชิ้น`;
            
            // ปรับค่า Input อัตโนมัติถ้าของเหลือน้อยกว่าค่าที่ตั้งไว้
            const qtyInput = document.getElementById('drawQty');
            if(parseInt(qtyInput.value) > selectedPrize.remain) {
                qtyInput.value = selectedPrize.remain;
            }
            
            toggleBar('leftBar'); // ปิดแถบหลังจากเลือก
        }

        async function startDraw() {
            if (!selectedPrize) return alert("กรุณากดปุ่ม 'ของรางวัล' ทางซ้าย เพื่อเลือกของรางวัลก่อนสุ่ม");
            
            const qtyInput = document.getElementById('drawQty');
            const qty = parseInt(qtyInput.value);

            if (qty < 1) return alert("กรุณาระบุจำนวนที่ต้องการสุ่ม");
            if (qty > selectedPrize.remain) return alert(`ขออภัย! รางวัลนี้เหลือเพียง ${selectedPrize.remain} ชิ้น ไม่สามารถสุ่ม ${qty} คนได้`);
            
            const btn = document.getElementById('drawBtn');
            btn.disabled = true;
            btn.innerText = "กำลังสุ่ม...";

            // กรองหาเลขที่ยังว่างอยู่
            let available = [];
            for(let i=1; i<=182; i++) {
                if(!drawnNumbers.includes(i)) available.push(i);
            }

            if(available.length < qty) {
                btn.disabled = false;
                btn.innerText = "เริ่มสุ่มรางวัล";
                return alert("จำนวนคนที่มีสิทธิ์เหลือน้อยกว่าจำนวนที่ต้องการสุ่ม");
            }

            // สุ่มเลือกผู้ชนะตามจำนวน (qty)
            let winners = [];
            for(let i=0; i<qty; i++) {
                const randIdx = Math.floor(Math.random() * available.length);
                winners.push(available.splice(randIdx, 1)[0]);
            }

            // แสดงตัวเลขที่สุ่มได้บนหน้าจอ
            const container = document.getElementById('numberContainer');
            container.innerHTML = winners.map(n => `
                <div class="winner-card w-24 h-24 md:w-40 md:h-40 bg-white border-4 border-indigo-100 rounded-3xl shadow-xl flex items-center justify-center text-4xl md:text-6xl font-black text-indigo-600 italic">
                    ${n}
                </div>
            `).join('');

            // บันทึกผลไปยัง Backend
            try {
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', // เพื่อเลี่ยงปัญหา CORS เบื้องต้นสำหรับ Apps Script
                    body: JSON.stringify({ 
                        action: "saveResult", 
                        prizeName: selectedPrize.name, 
                        winners, 
                        auth_token: AUTH_TOKEN 
                    })
                });
            } catch (e) { console.error("Save error:", e); }

            // อัปเดตข้อมูลใหม่หลังจากบันทึก (รอประมาณ 1-2 วินาทีเพื่อให้ Sheets อัปเดต)
            setTimeout(async () => {
                await init();
                btn.disabled = false;
                btn.innerText = "กดเพื่อเริ่มสุ่ม";
            }, 1500);
        }

        function toggleBar(id) {
            const el = document.getElementById(id);
            if (id === 'leftBar') el.classList.toggle('-translate-x-full');
            else el.classList.toggle('translate-x-full');
        }

        window.onload = init;
    </script>
</body>
</html>
