<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;500;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Kanit', sans-serif; background-color: #f9fafb; }
        .sidebar { transition: transform 0.3s ease-in-out; }
        .winner-card { animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body class="overflow-hidden">

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyUYG6JJJaO3m9Is0qSid5Eo-75XsvUqrWl7GJiPa1RlZG7MRSdVTgzhrSht_3mZOOupw/exec"; 
        const AUTH_TOKEN = "I_want_to_eat_rn";
        let prizes = [], drawnNumbers = [], history = [];

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                prizes = data.prizes.sort((a,b) => a.priority - b.priority);
                drawnNumbers = data.drawnNumbers;
                history = data.history;
                renderUI();
            } catch (e) { console.error("Fetch error", e); }
        }

        function renderUI() {
            document.getElementById('prizeList').innerHTML = prizes.map(p => `
                <div class="p-3 mb-2 bg-white rounded border border-slate-200 shadow-sm">
                    <p class="font-bold text-slate-700">${p.name}</p>
                </div>
            `).join('');

            document.getElementById('historyList').innerHTML = history.slice().reverse().map(h => `
                <div class="p-2 mb-2 bg-indigo-50 border-l-4 border-indigo-500 rounded text-sm">
                    <span class="font-black">#${h.number}</span> - ${h.prize}
                </div>
            `).join('');
        }

        async function startDraw() {
            const prize = prizes[0]; // เลือกรางวัลตาม Priority แรกที่ยังเหลืออยู่
            if (!prize) return alert("ของรางวัลหมดแล้ว!");

            const btn = document.getElementById('drawBtn');
            btn.disabled = true;
            btn.innerText = "กำลังสุ่ม...";

            // Logic: กรองเลขที่ยังไม่ถูกสุ่ม (1-182)
            let available = [];
            for(let i=1; i<=182; i++) if(!drawnNumbers.includes(i)) available.push(i);

            if(available.length < 1) return alert("คนสุ่มครบ 182 คนแล้ว!");

            let winners = [];
            let count = Math.min(prize.remain, available.length);
            
            for(let i=0; i<count; i++) {
                const idx = Math.floor(Math.random() * available.length);
                winners.push(available.splice(idx, 1)[0]);
            }

            // แสดงผล UI
            document.getElementById('prizeTitle').innerText = `รางวัล: ${prize.name}`;
            const container = document.getElementById('numberContainer');
            container.innerHTML = winners.map(n => `
                <div class="winner-card bg-white text-indigo-600 text-6xl md:text-8xl font-black w-40 h-40 md:w-56 md:h-56 flex items-center justify-center rounded-3xl shadow-2xl border-4 border-indigo-100 italic">
                    ${n}
                </div>
            `).join('');

            // บันทึก Backend
            await fetch(API_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "saveResult", prizeName: prize.name, winners, auth_token: AUTH_TOKEN })
            });

            await fetchData();
            btn.disabled = false;
            btn.innerText = "สุ่มรางวัลถัดไป";
        }

        function toggleSidebar(id) { document.getElementById(id).classList.toggle('-translate-x-full'); document.getElementById(id).classList.toggle('translate-x-full'); }
        window.onload = fetchData;
    </script>

    <!-- UI Layout -->
    <div class="relative h-screen w-full flex flex-col items-center justify-center p-4">
        
        <!-- Sidebar รางวัล (ซ้าย) -->
        <div id="leftBar" class="sidebar fixed left-0 top-0 h-full w-64 bg-slate-50 border-r p-6 z-40 -translate-x-full shadow-xl overflow-y-auto">
            <h2 class="text-xl font-black mb-6 border-b pb-2 uppercase tracking-tighter">Prizes List</h2>
            <div id="prizeList"></div>
        </div>

        <!-- Sidebar ประวัติ (ขวา) -->
        <div id="rightBar" class="sidebar fixed right-0 top-0 h-full w-64 bg-slate-50 border-l p-6 z-40 translate-x-full shadow-xl overflow-y-auto">
            <h2 class="text-xl font-black mb-6 border-b pb-2 uppercase tracking-tighter">History</h2>
            <div id="historyList"></div>
        </div>

        <!-- Nav Buttons -->
        <div class="fixed top-6 w-full px-10 flex justify-between z-50">
            <button onclick="document.getElementById('leftBar').classList.toggle('-translate-x-full')" class="bg-white p-3 rounded-full shadow-md hover:bg-slate-50">🎁 ของรางวัล</button>
            <button onclick="document.getElementById('rightBar').classList.toggle('translate-x-full')" class="bg-white p-3 rounded-full shadow-md hover:bg-slate-50">📜 ประวัติ</button>
        </div>

        <!-- Main Content -->
        <div class="text-center">
            <h3 id="prizeTitle" class="text-indigo-500 font-bold text-5xl mb-4 tracking-widest uppercase">พร้อมสำหรับการสุ่ม</h3>
            <div id="numberContainer" class="flex flex-wrap justify-center gap-6 mb-12">
                <div class="text-slate-200 text-9xl font-black italic select-none">READY</div>
            </div>
            <button id="drawBtn" onclick="startDraw()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-2xl font-black px-16 py-6 rounded-2xl shadow-[0_20px_50px_rgba(79,70,229,0.3)] transition-all transform active:scale-95">
                เริ่มสุ่มรางวัล
            </button>
            <p class="mt-8 text-slate-400 text-sm uppercase tracking-[0.3em]">182 Participants</p>
        </div>
    </div>

</body>
</html>
